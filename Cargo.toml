[package]
name = "ferrocap"
version = "0.3.5"
edition = "2024"
description = "Ferrocap - clip it after it happens"

[dependencies]
ab_glyph = "0.2.32"
arboard = "3.7.0"
cpal = "0.18.2"
dirs = "7.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow"] }
egui_extras = { version = "0.37.0", features = ["image", "file"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
log = "0.4"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny-skia = "0.12.0"
tray-icon = "0.26.1"
wasapi = "0.27"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Media_Audio", "Win32_Media_Multimedia", "Win32_System_SystemInformation", "Win32_System_IO", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp"] }
winreg = "0.56.0"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 4

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 2

[build-dependencies]
winresource = "0.1.34"
